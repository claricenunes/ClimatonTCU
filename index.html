  <body>
    <div id="root"></div>
    <!-- Contraparte de public/404.html: decodifica a rota que veio na query string via
         redirect e restaura a URL real antes do React Router montar. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </body>
